[project]
name = "minio-resource-tests"
version = "1.0.2"
description = "Integration tests for the minio Keystone resource package."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "pytest>=8",
  "pyyaml>=6",
]

[dependency-groups]
dev = [
  "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
markers = [
  "integration: requires Docker and the pinned MinIO image",
]
testpaths = ["tests"]
pythonpath = ["scripts"]
