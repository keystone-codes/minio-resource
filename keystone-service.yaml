schema_version: 1
kind: resource
name: minio
version: 1.0.2
publisher: keystone-codes
summary: S3-compatible object storage (MinIO) for services that need an s3 resource.
homepage: https://github.com/keystone-codes/minio-resource

provides: {kind: s3, version: 1, container: server}

containers:
  server:
    # RELEASE.2025-09-07T16-13-09Z binaries, packaged for GHCR (amd64 and arm64).
    # Image 1.0.2 runs as uid:gid 10001:10001 (chowning an older root-owned
    # /data volume once, on upgrade), pins the base image by digest, and adds
    # NOTICE at /licenses.
    image: ghcr.io/keystone-codes/minio-server@sha256:21ae817b30283b62ef184f58fbd1e9891c8ac62c5f2337543b97075bd077cd5b
    port: 9000
    command: [server, /data, --quiet]
    env:
      - name: MINIO_BROWSER
        default: "off"
    volumes:
      - {name: data, path: /data}
    secrets:
      - {name: MINIO_ROOT_USER, generate: {bytes: 16}}
      - {name: MINIO_ROOT_PASSWORD, generate: {bytes: 32}}
    healthcheck: {command: [mc, ready, local], interval: 10s, start_period: 20s}

provision:
  per_consumer: bucket_and_user
  # RELEASE.2025-08-13T08-35-41Z client, packaged with a shell so provision can run.
  # Image 1.0.2 pins the base image by digest and adds NOTICE at /licenses.
  # It still defaults to root; see README.md#running-as-non-root.
  image: ghcr.io/keystone-codes/minio-client@sha256:b0d314c8471e4b6cb78ea50df3ca176073f1ac97a810041a4ff0c427046d4f4c
  script: provision.sh
  admin_env: {user: MINIO_ROOT_USER, password: MINIO_ROOT_PASSWORD}
